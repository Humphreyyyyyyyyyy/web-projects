<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <link href="style.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <form>
      <div>
        <h3>Sign in to<span class="textcolor">My-Art</span></h3>
      </div>
      <div class="head">
        <p class="headtwo">
          <span class="svg"><img src="icons8-google.svg" /></span>Sign in with
          Google
        </p>
      </div>
      <fieldset><legend>or sign in with email</legend></fieldset>
      <div class="top">
        <label for="email"><i class="fa-solid fa-envelope"></i>Email</label
        ><br />
        <input type="email" id="email" name="email" required /><br />
      </div>
      <div class="top">
        <label for="password"><i class="fa-solid fa-lock"></i>Password</label
        ><br />
        <input type="password" id="password" name="password" required /><br />
      </div>
      <div class="btn"><button type="submit">Login</button></div>
      <div class="bordertwo">
        <p class="border">Don't have an account? <a href="#">Sign up</a></p>
      </div>
      <div class="bordertwo"><p class="border">Forgot password?</p></div>
    </form>
  </body>
</html>
