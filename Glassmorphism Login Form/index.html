<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Codewithvictory</title>
</head>
<body>
    <div class="loginform">
        <form>
            <h2>Welcome</h2>
            <div class="inputdiv">
                <input type="email" placeholder="Email" id="email" name="email" required><br><br>
                <input type="password" placeholder="Password" name="password" required><br>
            </div>
            <div class="btn">
                <button>Login</button>
            </div>
            <div class="lastparagraph">
                <p><a href="#">Forgot Password?</a></p>
                <p><a href="#">Sign Up!</a></p>
            </div>
            <hr>
            <h4>OR LOG IN WITH</h4>
            <div class="svgs">
                <img class="google" src="icons8-google.svg" style="width: 40px; height: 50px;">
                <img class="facebook" src="facebooklogo.svg" style="width: 41px; height: 50px;">
            </div>
        </form>
    </div>
</body>
</html>
