  <body>
    <div class="form">
      <form>
        <div class="fa"><i class="fa-solid fa-user"></i></div>
        <h2>Log In</h2>
        <div>
          <h4>Welcome back! please enter your details to sign in!</h4>
        </div>
        <div>
          <div>
            <label for="email">Email</label>
            <input class="one" type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input class="one" type="password" id="password" name="password" />
          </div>
        </div>
        <div class="check">
          <input class="che" type="checkbox" id="checkbox" name="checkbox" />
          <label class="checkone" for="checkbox"
            >Remember me</label
          >
          <p><a href="#">Forgot password?</a></p>
          
        </div>
        <div class="btn"><button type="submit">Log in</button></div>
        <p class="two"><b>Don't have an account? <a href="#">Sign up!</a>
        
      </form>
    </div>
  </body>
