<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <div class="container">
        <fieldset><legend>Signup</legend></fieldset>
        <p>
          Welcome,<br />
          please enter your details
        </p>
        <div class="seperator">
          <label for="name"></label><br />
          <input
            type="text"
            placeholder="Username"
            id="name"
            name="name"
            required
          />
        </div>
        <br />
        <div class="seperator">
          <label for="email"></label><br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
        </div>
        <br />
        <div class="seperator">
          <label for="password"></label><br />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>
        <br />
        <div class="btn"><button type="submit">Submit</button></div>
      </div>
    </form>
  </body>
</html>
