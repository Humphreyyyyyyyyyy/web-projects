<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      rel="stylesheet"
    />
    <title>Codewithvictory</title>
  </head>
  <body>
    <form>
      <fieldset>
        <div class="fa"><i class="fa-solid fa-user"></i></div>
        <h2>Log in</h2>
        <h3>Welcome!</h3>
        <p>
          <em>Please enter your details to sign in to codewithvictory</em>
        </p>
        <div>
          <label for="email"></label><br />
          <input
            type="email"
            placeholder="Enter Your Email"
            id="email"
            name="email"
            required
          />
        </div>
        <h4 class="forgot"><em>Forgot password?</em></h4>
        <div>
          <label for="password"></label><br />
          <input
            class="inputp"
            type="password"
            placeholder="Enter Your Password"
            id="password"
            name="password"
            required
          />
        </div>
        <div class="check">
          <div class="checkbox">
            <input type="checkbox" id="checkbox" name="checkbox" />
          </div>
          <label for="checkbox">Remember me on this device</label>
        </div>

        <div class="btn">
          <button type="submit">Log in</button>
        </div>
      </fieldset>
    </form>
  </body>
</html>
