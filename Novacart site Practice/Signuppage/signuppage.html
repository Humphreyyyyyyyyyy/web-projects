<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <form>
      <h1>Sign Up</h1>
      <label class="two" for="username">Username:</label>
      <input
        placeholder="Enter username.."
        id="username"
        required
      /><br /><br />
      <label class="two" for="email">Email:</label>
      <input
        type="email"
        placeholder="Enter email.."
        id="email"
        required
      /><br /><br />
      <label class="two" for="password">Password:</label>
      <input
        type="password"
        placeholder="Enter password"
        id="password"
        required
      /><br /><br />
      <div class="btn"><button type="submit">Sign up</button></div>

      <p>
        Already have an account? <br />
        <a href="../Login page/loginpage.html">Log in</a> or
        <a href="../index.html">Return to home page</a>
      </p>
    </form>
  </body>
</html>
