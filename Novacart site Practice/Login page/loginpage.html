<!doctype html>
<html lang="en-US">
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Log in</title>
      <link href="style.css" rel="stylesheet" />
      <script
        src="https://kit.fontawesome.com/bab63b943d.js"
        crossorigin="anonymous"
      ></script>
    </head>

    <body>
      <form>
        <div class="container">
          <h1>Log in</h1>

          <label for="email" class="two">Email:</label>
          <input
            type="email"
            placeholder="Enter email.."
            id="email"
            required
          /><br /><br />
          <label for="password" class="two">Password:</label>
          <input
            type="password"
            placeholder="Enter password"
            id="password"
            required
          /><br /><br />
          <div class="btn"><button type="submit">Log in</button></div>
          <p>
            Don't have an account?<br />
            <a href="../Signuppage/signuppage.html">Sign up</a> or
            <a href="../index.html">Return to home page</a><br /><br />

            <span class="sub">
              <label for="newsletter">Subscribe to Product Updates:</label>
            </span>
            <input class="check" type="checkbox" id="newsletter" />
          </p>
        </div>
      </form>
    </body>
  </html>
</html>
